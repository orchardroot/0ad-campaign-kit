; local.cfg — personal overrides, layered on top of default.cfg.
; The in-game Options screen writes to user.cfg, which is read after this file,
; so anything you later toggle in-game wins over what's here. That's fine.
; To revert everything: delete this file.

; ---------------------------------------------------------------------------
; Learning aids
; ---------------------------------------------------------------------------

; Unit stats in tooltips: armour, attack, speed, counters. Off by default,
; which is a strange choice for a game this stat-heavy. This is the single
; most useful setting on the list.
showdetailedtooltips = true

; Game clock, top right. You cannot judge a build order without it —
; "Town Phase at 6:30" is a fact you can improve on; "fairly early" isn't.
gui.session.timeelapsedcounter = true

; ---------------------------------------------------------------------------
; Handling
; ---------------------------------------------------------------------------

; Buildings snap to each other's edges when placed. Makes walls, and any
; tidy dock-and-storehouse cluster, far less fiddly.
gui.session.snaptoedges = "enabled"

; Let the camera pull back further than stock (200). On eight-player island
; maps, seeing the whole sea at once is the difference between commanding a
; fleet and chasing it.
view.zoom.max = 300.0

; ---------------------------------------------------------------------------
; Performance — iMac14,2, GTX 775M (2 GB VRAM) at 2560x1440
; ---------------------------------------------------------------------------
; Nothing here is enabled. This machine handles ordinary games fine; it's the
; late game on big maps — Aegean Archipelago, eight players, hundreds of units
; — where it will struggle. Uncomment from the top down until it's smooth.

; Render below native and upscale with FSR. Biggest single win, smallest
; visual cost. 0.85 is barely noticeable; 0.75 is noticeable but very fast.
;renderer.scale = 0.85

; HDR, bloom, depth of field. Pretty, and the first thing to go.
;postproc = false

; Water reflection and refraction — expensive, and you play island maps.
;waterreflection = false
;waterrefraction = false

; Lower-resolution shadow maps (-1 = Low, 0 = Medium, the default).
;shadowquality = -1

; Halve texture memory. Relevant with only 2 GB of VRAM.
;textures.quality = 1

; NOTE: do NOT raise shadowquality above 0 on this machine. default.cfg warns
; that high values can crash the game on low-VRAM cards, and 2 GB qualifies.
